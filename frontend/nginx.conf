server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a SPA — unknown routes must fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; Flutter adds content hashes to filenames
    location ~* \.(js|css|png|jpg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
